<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#060912"/><stop offset=".55" stop-color="#0B1020"/><stop offset="1" stop-color="#130B20"/>
    <animate attributeName="x1" values="0;0.2;0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#00D9FF"/><stop offset=".5" stop-color="#5865F2"/><stop offset="1" stop-color="#A855F7"/>
    <animate attributeName="x2" values="1;0.8;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="360" fill="url(#bg)"/>
<g fill="none" stroke="url(#line)" stroke-width="3" opacity=".55">
  <path d="M60 80h170v50h120"/><path d="M1100 90h170v70h70"/><path d="M970 300h180v-55h160"/><path d="M70 270h150v-55h120"/>
</g>
<g filter="url(#glow)">
  <circle cx="230" cy="80" r="5" fill="#00D9FF"><animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="130" r="5" fill="#5865F2"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1270" cy="160" r="5" fill="#00D9FF"><animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="220" cy="270" r="5" fill="#A855F7"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1150" cy="245" r="5" fill="#A855F7"><animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<text x="700" y="155" text-anchor="middle" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700">ARK-MASTER</text>
<text x="700" y="210" text-anchor="middle" fill="#A5B4FC" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="5">LEARN • BUILD • BREAK • DEBUG • IMPROVE</text>
<rect x="455" y="242" width="490" height="3" rx="2" fill="url(#line)"><animate attributeName="width" values="420;540;420" dur="5s" repeatCount="indefinite"/></rect>
<text x="700" y="285" text-anchor="middle" fill="#94A3B8" font-family="Arial,Helvetica,sans-serif" font-size="18">Software Engineering · Systems · AI · Cybersecurity · Computer Engineering</text>
</svg>